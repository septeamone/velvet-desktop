  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#bg)"/>
  <!-- складка бархата -->
  <path d="M48 700 C 300 560, 640 640, 976 470 L976 752 a224 224 0 0 1 -224 224 H272 a224 224 0 0 1 -224 -224 Z" fill="url(#fold)" opacity="0.55"/>
