  <!-- значок «играть» со скруглёнными углами -->
  <path d="M410 316 Q392 305 392 328 L392 696 Q392 719 410 708 L724 524 Q744 512 724 500 Z" fill="url(#play)" stroke="url(#play)" stroke-width="44" stroke-linejoin="round"/>
